version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
    # One PR a month for all Go modules. CI (ci.yml) builds it with Go 1.25
    # only, so an update that needs a newer Go fails there.
    groups:
      go-modules:
        patterns: ["*"]
    ignore:
      # 0.42+ needs Go 1.26; drop this when the plugin moves to it.
      - dependency-name: golang.org/x/text
        versions: [">= 0.42.0"]
